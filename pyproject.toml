[project]
name = "cyanbukkit-mcp"
version = "0.1.0"
description = "MCP server for Bukkit, Spigot, NMS, ProtocolLib, PlaceholderAPI, and Vault documentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
crawl = [
    "crawl4ai>=0.4.0",
]
build = [
    "pyinstaller>=6.0",
    "pillow>=10.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
cyanbukkit-mcp = "cyanbukkit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyanbukkit_mcp"]
